<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Taype-in · Voitures et ballons dans l’arène actuelle</title>
    <style>
      :root { color-scheme: dark; font-family: system-ui, sans-serif; background: #0b1426; color: #e8eef9; }
      * { box-sizing: border-box; }
      body { margin: 0; }
      main { max-width: 1160px; margin: auto; padding: 24px; }
      h1 { font-size: clamp(1.2rem, 3vw, 1.8rem); margin: 0 0 20px; }
      .eyebrow { font-size: .7rem; letter-spacing: .15em; color: #9aa8c3; }
      .toolbar { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
      .toolbar p { color: #9aa8c3; font-size: .85rem; margin: 0; }
      .ball-options { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 16px; }
      .ball-options button { display: grid; justify-items: center; min-width: 90px; padding: 6px 12px; font-size: .8rem; }
      select { background: #14213d; color: #e8eef9; padding: 8px; border: 1px solid #6b7a99; border-radius: 6px; font: inherit; }
      .toggle { display: flex; gap: 6px; }
      button { border: 1px solid #6b7a99; background: #14213d; color: #e8eef9; border-radius: 8px; padding: 9px 15px; font: inherit; cursor: pointer; }
      button[aria-pressed="true"] { background: #4d94ff; border-color: #4d94ff; color: #0b1426; }
      button:focus-visible, textarea:focus-visible { outline: 3px solid #ff9a3c; outline-offset: 3px; }
      .arena { display: block; width: 100%; height: auto; max-height: 60vh; margin: 8px 0; }
      .car-tag { fill: #e8eef9; font-weight: 700; paint-order: stroke; stroke: #0b1426; stroke-width: 3px; }
      .actions { font-size: .85rem; }
      .actions span { margin-left: auto; color: #9aa8c3; }
      .typing { margin-top: 20px; padding: 18px; border: 1px solid #364866; border-radius: 12px; background: #14213d; }
      .prompt { font: 1.15rem/1.7 ui-monospace, monospace; margin: 0 0 16px; }
      .correct { color: #4ade80; } .wrong { color: #ff6b6b; background: #4a1620; }
      .cursor { border-left: 2px solid #ff9a3c; }
      label { display: block; font-size: .8rem; color: #9aa8c3; margin-bottom: 8px; }
      textarea { display: block; width: 100%; min-height: 64px; resize: vertical; background: #0b1426; color: #e8eef9; border: 1px solid #6b7a99; border-radius: 6px; padding: 10px; font: inherit; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script src="arena-preview.js"></script>
  </body>
</html>
