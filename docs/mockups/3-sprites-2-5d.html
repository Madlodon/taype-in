<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Maquette 3 · 2.5D Blender</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Russo+One&display=swap"
      rel="stylesheet"
    />
    <style>
      /* Palette sombre de app/globals.css. Sprites rendus par assets/models.py. */
      :root {
        --background: #0b1426;
        --foreground: #e8eef9;
        --surface: #14213d;
        --muted: #9aa8c3;
        --border: #6b7a99;
        --primary: #4d94ff;
        --accent: #ff9a3c;
        --accent-strong: #ff9a3c;
        --correct: #4ade80;
        --wrong: #ff6b6b;
        --wrong-surface: #4a1620;
        /* Pente des voies : suit l'angle des voitures dans les sprites. */
        --slope: 18deg;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        background: linear-gradient(#060b17, var(--background) 40%);
        color: var(--foreground);
        font-family: system-ui, sans-serif;
      }

      header {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        max-width: 64rem;
        margin: 0 auto;
        padding: 1rem;
      }

      h1 {
        margin: 0;
        font-family: "Russo One", sans-serif;
        font-size: 1.5rem;
        white-space: nowrap;
      }

      .rank {
        font-family: "Russo One", sans-serif;
        font-size: 1.25rem;
        color: var(--accent-strong);
      }

      main {
        max-width: 64rem;
        margin: 0 auto;
        padding: 0 1rem 2rem;
      }

      .arena {
        position: relative;
        overflow: hidden;
      }

      /* Les voies sont inclinées ; les sprites restent droits par-dessus. */
      .turf {
        margin-top: 40px;
        transform: skewY(var(--slope));
        transform-origin: top left;
      }

      .lane {
        position: relative;
        height: 60px;
        border-top: 2px solid #ffffff22;
        background: repeating-linear-gradient(90deg, #17603a 0 4rem, #1b6e43 4rem 8rem);
      }

      .lane:first-child {
        border-top: 3px solid var(--primary);
        box-shadow: 0 -6px 18px color-mix(in srgb, var(--primary) 50%, transparent);
      }

      .lane:last-child {
        border-bottom: 3px solid var(--primary);
      }

      .lane::after {
        /* But au bout de chaque voie. */
        content: "";
        position: absolute;
        top: 0.5rem;
        right: 0;
        bottom: 0.5rem;
        width: 2.5rem;
        border: 3px solid var(--accent);
        border-right: 0;
        background: repeating-linear-gradient(90deg, transparent 0 5px, #ff9a3c55 5px 7px);
        box-shadow: 0 0 14px var(--accent);
      }

      .sprite {
        position: absolute;
        top: 0;
        left: 0;
        pointer-events: none;
        transition: transform 0.15s linear;
      }

      .car {
        width: 7.5rem;
      }

      /* Le ballon tourne dans son conteneur : le translate du conteneur reste intact. */
      .ball img {
        display: block;
        width: 2.75rem;
        animation: spin 0.8s linear infinite;
      }

      @keyframes spin {
        to {
          rotate: 360deg;
        }
      }

      .label {
        position: absolute;
        top: 0;
        left: 0;
        border-radius: 999px;
        background: #0b1426cc;
        padding: 0 0.5rem;
        font-size: 0.75rem;
        transition: transform 0.15s linear;
      }

      .label.you {
        background: var(--primary);
        color: var(--background);
        font-weight: 700;
      }

      .flash {
        height: 1.75rem;
        margin: 0.5rem 0 0.25rem;
        text-align: center;
        font-family: "Russo One", sans-serif;
        opacity: 0;
      }

      .flash.show {
        animation: flash 1s ease-out;
      }

      .flash.up {
        color: var(--correct);
      }

      .flash.down {
        color: var(--wrong);
      }

      @keyframes flash {
        0%,
        70% {
          opacity: 1;
        }
        100% {
          opacity: 0;
        }
      }

      .text {
        overflow: hidden;
        border: 2px solid var(--border);
        border-radius: 0.75rem;
        background: var(--surface);
        padding: 1.25rem 1rem;
        font-family: "JetBrains Mono", monospace;
        font-size: 1.75rem;
        white-space: pre;
      }

      .demo-text {
        display: inline-block;
        transition: transform 0.12s ease-out;
      }

      .done {
        color: var(--muted);
      }

      .current {
        box-shadow: -3px 0 0 var(--accent-strong);
        animation: blink 1s steps(1) infinite;
      }

      .wrong {
        color: var(--wrong);
        background: var(--wrong-surface);
        text-decoration: underline wavy;
        animation: none;
      }

      @keyframes blink {
        50% {
          box-shadow: none;
        }
      }

      .hint {
        color: var(--muted);
        text-align: center;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>Taype-in</h1>
      <span class="rank" id="rank"></span>
    </header>
    <main>
      <div class="arena" id="arena">
        <div class="turf" id="turf"></div>
      </div>
      <p class="flash" id="flash" aria-live="polite"></p>
      <div class="text" id="text"></div>
      <p class="hint">
        Voitures et ballon : modèles low-poly Blender (assets/models.py) rendus en sprites. Tape le texte pour
        avancer.
      </p>
    </main>

    <script>
      // Démo commune aux maquettes : on tape le texte pour de vrai, trois bots avancent seuls.
      // Mode bloquant : une faute reste affichée sur la lettre courante jusqu'à la bonne touche.
      // Chaque maquette dessine la piste elle-même dans onProgress(players).
      // onRankChange(better) sert à l'indicateur de dépassement (CRS-3).
      // onType(correct) est appelé à chaque touche ; oneLine peut être une fonction pour changer de mise en page.
      // startDemo renvoie paint() pour redessiner le texte après un changement de mise en page.

      const TEXT =
        "Le ballon file vers le but adverse. Chaque mot tapé sans faute donne un coup de boost à ta voiture. " +
        "Garde les yeux sur le texte et laisse tes doigts faire le travail : la victoire se joue à la dernière seconde.";

      function startDemo({ textEl, oneLine, onProgress, onRankChange = () => {}, onType = () => {} }) {
        const players = [
          { name: "Toi", you: true, progress: 0 },
          { name: "Maya", speed: 0.0021, progress: 0 },
          { name: "Léo", speed: 0.0017, progress: 0 },
          { name: "Zoé", speed: 0.0013, progress: 0 },
        ];
        let index = 0;
        let wrong = false;
        let rank = 1;

        function update() {
          onProgress(players);
          const newRank = 1 + players.filter((p) => !p.you && p.progress > players[0].progress).length;
          if (newRank !== rank) onRankChange(newRank < rank);
          rank = newRank;
        }

        const track = document.createElement("span");
        track.className = "demo-text";
        const letters = [...TEXT].map((char) => {
          const span = document.createElement("span");
          span.textContent = char;
          track.append(span);
          return span;
        });
        textEl.append(track);

        function paint() {
          letters.forEach((span, i) => {
            span.className = i < index ? "done" : i === index ? (wrong ? "current wrong" : "current") : "";
          });
          if (typeof oneLine === "function" ? oneLine() : oneLine) {
            // Garde la lettre courante au tiers de la ligne : le texte défile vers la gauche.
            const current = letters[Math.min(index, letters.length - 1)];
            const shift = Math.max(0, current.offsetLeft - textEl.clientWidth / 3);
            track.style.transform = `translateX(${-shift}px)`;
          } else {
            track.style.transform = "";
          }
          players[0].progress = index / letters.length;
          update();
        }

        document.addEventListener("keydown", (event) => {
          if (event.key.length !== 1 || event.ctrlKey || event.metaKey || index >= letters.length) return;
          event.preventDefault();
          wrong = event.key !== TEXT[index];
          if (!wrong) index += 1;
          onType(!wrong);
          paint();
        });

        setInterval(() => {
          for (const bot of players.slice(1)) {
            bot.progress = Math.min(1, bot.progress + bot.speed * (0.6 + Math.random() * 0.8));
          }
          update();
        }, 100);

        paint();
        return paint;
      }
    </script>
    <script>
      const arena = document.getElementById("arena");
      const turf = document.getElementById("turf");
      const flash = document.getElementById("flash");
      const rank = document.getElementById("rank");
      const LANE = 60;
      const TOP = 40; // place pour la voiture de la première voie
      const TAN = Math.tan((18 * Math.PI) / 180);
      const runners = [];

      function place(el, x, y) {
        el.style.transform = `translate(${x}px, ${y}px)`;
      }

      startDemo({
        textEl: document.getElementById("text"),
        oneLine: true,
        onProgress(players) {
          const width = arena.clientWidth;
          if (!runners.length) {
            arena.style.height = `${TOP + players.length * LANE + width * TAN}px`;
            players.forEach((player) => {
              turf.append(Object.assign(document.createElement("div"), { className: "lane" }));
              const car = Object.assign(document.createElement("img"), {
                className: "sprite car",
                src: `assets/car-${player.you ? "blue" : "orange"}.png`,
                alt: "",
              });
              const ball = Object.assign(document.createElement("div"), { className: "sprite ball" });
              ball.append(Object.assign(document.createElement("img"), { src: "assets/ball.png", alt: "" }));
              const label = Object.assign(document.createElement("span"), {
                className: player.you ? "label you" : "label",
                textContent: player.name,
              });
              arena.append(car, ball, label);
              runners.push({ car, ball, label });
            });
          }

          const room = width - 11 * 16;
          players.forEach((player, i) => {
            const { car, ball, label } = runners[i];
            const x = player.progress * room;
            // Le sol de la voie descend avec la pente : y suit x.
            const ground = TOP + i * LANE + LANE * 0.75 + x * TAN;
            place(car, x, ground - 84);
            place(ball, x + 92, ground - 50 + 92 * TAN);
            place(label, x + 8, ground - 58);
          });
          const position = 1 + players.filter((p) => !p.you && p.progress > players[0].progress).length;
          rank.textContent = `${position === 1 ? "1er" : `${position}e`} / ${players.length}`;
        },
        onRankChange(better) {
          flash.textContent = better ? "▲ Dépassement !" : "▼ Tu te fais dépasser";
          flash.className = `flash show ${better ? "up" : "down"}`;
          flash.addEventListener("animationend", () => (flash.className = "flash"), { once: true });
        },
      });
    </script>
  </body>
</html>
