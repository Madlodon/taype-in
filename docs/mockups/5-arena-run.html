<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Maquette 5 · Course dans l'arène</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Russo+One&display=swap"
      rel="stylesheet"
    />
    <style>
      /* Palette sombre de app/globals.css. */
      :root {
        --background: #0b1426;
        --foreground: #e8eef9;
        --surface: #14213d;
        --muted: #9aa8c3;
        --border: #6b7a99;
        --primary: #4d94ff;
        --accent: #ff9a3c;
        --accent-strong: #ff9a3c;
        --correct: #4ade80;
        --wrong: #ff6b6b;
        --wrong-surface: #4a1620;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        background: var(--background);
        color: var(--foreground);
        font-family: system-ui, sans-serif;
      }

      header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 1rem;
        max-width: 68rem;
        margin: 0 auto;
        padding: 1rem;
      }

      h1 {
        margin: 0;
        font-family: "Russo One", sans-serif;
        font-size: 1.5rem;
        white-space: nowrap;
      }

      .rank {
        font-family: "Russo One", sans-serif;
        font-size: 1.25rem;
        color: var(--accent-strong);
      }

      main {
        max-width: 68rem;
        margin: 0 auto;
        padding: 0 1rem 2rem;
      }

      /* Arène vue en coupe, comme une maison de poupée. */
      svg.arena {
        display: block;
        width: 100%;
        height: auto;
      }

      .lane {
        fill: none;
        stroke: #ffffff1f;
        stroke-width: 1.5;
        stroke-dasharray: 6 8;
      }

      .car-body {
        transition: transform 0.12s linear;
      }

      .wobble {
        animation: wobble 0.4s ease-in-out;
      }

      @keyframes wobble {
        25% {
          transform: rotate(-9deg);
        }
        50% {
          transform: rotate(7deg);
        }
        75% {
          transform: rotate(-4deg);
        }
      }

      .flame {
        transform-box: fill-box;
        transform-origin: right center;
        animation: flicker 0.12s linear infinite alternate;
      }

      @keyframes flicker {
        to {
          opacity: 0.75;
        }
      }

      .tag {
        font-family: "Russo One", sans-serif;
        font-size: 13px;
        fill: var(--muted);
        text-anchor: middle;
      }

      .tag.you {
        fill: var(--primary);
      }

      .explosion circle {
        transform-box: fill-box;
        transform-origin: center;
        animation: boom 0.9s ease-out forwards;
      }

      @keyframes boom {
        from {
          transform: scale(0.1);
          opacity: 1;
        }
        to {
          transform: scale(1);
          opacity: 0;
        }
      }

      /* Message de dépassement et de série, juste au-dessus du texte (CRS-3). */
      .status {
        display: flex;
        justify-content: space-between;
        align-items: center;
        min-height: 2rem;
        margin: 0.5rem 0 0.25rem;
        font-family: "Russo One", sans-serif;
      }

      .flash {
        opacity: 0;
      }

      .flash.show {
        animation: flash 1s ease-out;
      }

      .flash.up {
        color: var(--correct);
      }

      .flash.down {
        color: var(--wrong);
      }

      @keyframes flash {
        0%,
        70% {
          opacity: 1;
        }
        100% {
          opacity: 0;
        }
      }

      .streak {
        color: var(--accent-strong);
      }

      .layout {
        display: flex;
        gap: 0.5rem;
        font-family: system-ui, sans-serif;
        font-size: 0.875rem;
      }

      .layout button {
        border: 2px solid var(--border);
        border-radius: 999px;
        background: var(--surface);
        color: var(--foreground);
        padding: 0.25rem 0.75rem;
        font: inherit;
        cursor: pointer;
      }

      .layout button[aria-pressed="true"] {
        border-color: var(--primary);
        background: var(--primary);
        color: var(--background);
      }

      .text {
        overflow: hidden;
        border: 2px solid var(--border);
        border-radius: 0.75rem;
        background: var(--surface);
        padding: 1.25rem 1rem;
        font-family: "JetBrains Mono", monospace;
        font-size: 1.5rem;
        line-height: 1.8;
      }

      .text.one-line {
        font-size: 1.75rem;
        white-space: pre;
      }

      .demo-text {
        display: inline-block;
        transition: transform 0.12s ease-out;
      }

      .done {
        color: var(--muted);
      }

      .current {
        box-shadow: -3px 0 0 var(--accent-strong);
        animation: blink 1s steps(1) infinite;
      }

      .wrong {
        color: var(--wrong);
        background: var(--wrong-surface);
        text-decoration: underline wavy;
        animation: none;
      }

      @keyframes blink {
        50% {
          box-shadow: none;
        }
      }

      .hint {
        color: var(--muted);
        text-align: center;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>Taype-in</h1>
      <span class="rank" id="rank"></span>
    </header>
    <main>
      <svg class="arena" id="arena" viewBox="-70 0 1120 440" aria-label="Arène vue en coupe">
        <defs>
          <radialGradient id="turf" cx="50%" cy="100%" r="90%">
            <stop offset="0" stop-color="#16305c" />
            <stop offset="1" stop-color="#0c1830" />
          </radialGradient>
          <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur stdDeviation="4" result="blur" />
            <feMerge>
              <feMergeNode in="blur" />
              <feMergeNode in="SourceGraphic" />
            </feMerge>
          </filter>
          <pattern id="net" width="8" height="8" patternUnits="userSpaceOnUse">
            <path d="M0 0 L8 8 M8 0 L0 8" stroke="#ff9a3c66" stroke-width="1" />
          </pattern>
          <!-- Voiture vue de côté, roues à y = 0, orientée vers +x. -->
          <symbol id="car" viewBox="0 0 56 28">
            <path d="M4 20 L6 12 L20 10 L28 3 L42 3 L48 11 L54 13 L54 20 Z" fill="currentColor" />
            <path d="M24 10 L30 5 L40 5 L44 10 Z" fill="#0b1426" opacity="0.7" />
            <path d="M2 8 L12 6 L12 9 L4 11 Z" fill="currentColor" />
            <circle cx="15" cy="21" r="5.5" fill="#0b1426" />
            <circle cx="44" cy="21" r="5.5" fill="#0b1426" />
            <circle cx="15" cy="21" r="2" fill="#cbd5e1" />
            <circle cx="44" cy="21" r="2" fill="#cbd5e1" />
          </symbol>
        </defs>

        <!-- Coque de l'arène : sol, murs et plafond arrondis. -->
        <rect x="20" y="20" width="960" height="400" rx="120" fill="url(#turf)" stroke="#4d94ff" stroke-width="4" filter="url(#glow)" />
        <!-- Buts dans les murs : orange à gauche (l'arrivée), bleu à droite (décor). -->
        <rect x="-60" y="290" width="84" height="130" rx="6" fill="#0b1426" />
        <rect x="-60" y="290" width="84" height="130" rx="6" fill="url(#net)" stroke="#ff9a3c" stroke-width="3" filter="url(#glow)" />
        <rect x="976" y="290" width="64" height="130" rx="6" fill="#0b1426" stroke="#4d94ff" stroke-width="2" opacity="0.7" />
        <line x1="500" y1="400" x2="500" y2="420" stroke="#ffffff55" stroke-width="3" />
        <g fill="#ff9a3c" filter="url(#glow)">
          <ellipse cx="640" cy="418" rx="14" ry="3" />
          <ellipse cx="760" cy="418" rx="14" ry="3" />
          <ellipse cx="620" cy="22" rx="14" ry="3" />
          <ellipse cx="420" cy="22" rx="14" ry="3" />
        </g>

        <g id="lanes"></g>
        <g id="explosions"></g>
        <g id="racers"></g>
      </svg>

      <div class="status">
        <span class="flash" id="flash" aria-live="polite"></span>
        <span class="streak" id="streak"></span>
        <span class="layout" role="group" aria-label="Mise en page du texte">
          <button type="button" id="one" aria-pressed="true">Une ligne</button>
          <button type="button" id="block" aria-pressed="false">Bloc</button>
        </span>
      </div>
      <div class="text one-line" id="text"></div>
      <p class="hint">
        Coup d'envoi au centre, montée du mur, plafond, puis tir du plafond dans le but. Une série sans faute fait grossir
        le boost ; une faute fait déraper la voiture.
      </p>
    </main>

    <script src="demo.js"></script>
    <script>
      const NS = "http://www.w3.org/2000/svg";
      const lanes = document.getElementById("lanes");
      const racers = document.getElementById("racers");
      const explosions = document.getElementById("explosions");
      const textEl = document.getElementById("text");
      const flash = document.getElementById("flash");
      const streakEl = document.getElementById("streak");
      const rankEl = document.getElementById("rank");
      const COLORS = ["var(--primary)", "#ff9a3c", "#ffc56b", "#ff7a59"];
      const LEVELS = ["", "Boost", "Gros boost", "Supersonique !"];

      // Chaque joueur a sa ligne de profondeur, un peu plus à l'intérieur de l'arène que la précédente.
      // Coup d'envoi au centre → sol vers la droite → mur droit → plafond vers la gauche → tir en l'air dans le but.
      function trackPath(i) {
        const d = 12 + i * 12;
        const r = 120 - d;
        const floor = 420 - d;
        const wall = 980 - d;
        const ceiling = 20 + d;
        return (
          `M500 ${floor} L860 ${floor} A${r} ${r} 0 0 0 ${wall} 300 L${wall} 140 ` +
          `A${r} ${r} 0 0 0 860 ${ceiling} L330 ${ceiling} Q140 ${ceiling} -20 ${375 - i * 10}`
        );
      }

      function el(tag, attrs, parent) {
        const node = document.createElementNS(NS, tag);
        for (const [key, value] of Object.entries(attrs)) node.setAttribute(key, value);
        parent.append(node);
        return node;
      }

      const runners = [];
      let streak = 0;
      let youLevel = 0;

      function flameLevel(level) {
        // Longueur et couleur de la traînée selon la série.
        return [
          { length: 0, color: "#ff9a3c" },
          { length: 16, color: "#ff9a3c" },
          { length: 30, color: "#ffb347" },
          { length: 48, color: "#fff3c4" },
        ][level];
      }

      function build(players) {
        players.forEach((player, i) => {
          const path = el("path", { d: trackPath(i), class: "lane" }, lanes);
          const group = el("g", {}, racers);
          const body = el("g", { class: "car-body" }, group);
          const flame = el("path", { class: "flame", d: "M0 0 Z" }, body);
          const car = el("use", { href: "#car", x: -28, y: -27, width: 56, height: 28 }, body);
          car.style.color = COLORS[i];
          const ball = el("circle", { r: 9, fill: "#e8eef9", stroke: "#0b1426", "stroke-width": 2 }, racers);
          const tag = el("text", { class: player.you ? "tag you" : "tag" }, racers);
          tag.textContent = player.name;
          runners.push({ path, length: path.getTotalLength(), group, body, flame, ball, tag, level: 0, scored: false });
        });
      }

      function place(runner, progress, level) {
        const travel = runner.length - 40;
        const s = progress * travel;
        const p = runner.path.getPointAtLength(s);
        const q = runner.path.getPointAtLength(Math.min(runner.length, s + 1));
        const angle = Math.atan2(q.y - p.y, q.x - p.x);
        // Normale vers l'intérieur de l'arène : le « haut » de la voiture.
        const nx = Math.sin(angle);
        const ny = -Math.cos(angle);
        runner.group.setAttribute("transform", `translate(${p.x} ${p.y}) rotate(${(angle * 180) / Math.PI})`);

        const { length, color } = flameLevel(level);
        runner.flame.setAttribute("d", length ? `M-28 -14 L${-28 - length} -10 L-28 -6 Z` : "M0 0 Z");
        runner.flame.setAttribute("fill", color);
        runner.flame.setAttribute("filter", level === 3 ? "url(#glow)" : "");

        const b = runner.path.getPointAtLength(Math.min(runner.length, s + 36));
        runner.ball.setAttribute("cx", b.x + nx * 9);
        runner.ball.setAttribute("cy", b.y + ny * 9);
        runner.tag.setAttribute("x", p.x + nx * 42);
        runner.tag.setAttribute("y", p.y + ny * 42 + 4);

        if (progress >= 1 && !runner.scored) {
          runner.scored = true;
          goal(runner);
        }
      }

      function goal(runner) {
        const g = el("g", { class: "explosion" }, explosions);
        const color = runner === runners[0] ? "#4d94ff" : "#ff9a3c";
        el("circle", { cx: -20, cy: 355, r: 110, fill: color, opacity: 0.6 }, g);
        el("circle", { cx: -20, cy: 355, r: 70, fill: "#fff3c4" }, g);
        setTimeout(() => g.remove(), 1000);
        if (runner === runners[0]) {
          flash.textContent = "BUT !";
          flash.className = "flash show up";
        }
      }

      function setLayout(oneLine) {
        textEl.classList.toggle("one-line", oneLine);
        document.getElementById("one").setAttribute("aria-pressed", oneLine);
        document.getElementById("block").setAttribute("aria-pressed", !oneLine);
        repaint();
      }

      const repaint = startDemo({
        textEl,
        oneLine: () => textEl.classList.contains("one-line"),
        onProgress(players) {
          if (!runners.length) build(players);
          players.forEach((player, i) => {
            const runner = runners[i];
            if (!player.you && Math.random() < 0.02) runner.level = Math.floor(Math.random() * 3);
            place(runner, player.progress, player.you ? youLevel : runner.level);
          });
          const position = 1 + players.filter((p) => !p.you && p.progress > players[0].progress).length;
          rankEl.textContent = `${position === 1 ? "1er" : `${position}e`} / ${players.length}`;
        },
        onType(correct) {
          if (correct) {
            streak += 1;
          } else {
            streak = 0;
            // La faute fait déraper la voiture : on relance l'animation.
            const body = runners[0].body;
            body.classList.remove("wobble");
            void body.getBoundingClientRect();
            body.classList.add("wobble");
          }
          youLevel = streak >= 45 ? 3 : streak >= 25 ? 2 : streak >= 10 ? 1 : 0;
          streakEl.textContent = LEVELS[youLevel];
        },
        onRankChange(better) {
          flash.textContent = better ? "▲ Dépassement !" : "▼ Tu te fais dépasser";
          flash.className = `flash show ${better ? "up" : "down"}`;
          flash.addEventListener("animationend", () => (flash.className = "flash"), { once: true });
        },
      });

      // Le bouton perd le focus pour que la barre d'espace serve au texte.
      document.getElementById("one").addEventListener("click", (event) => {
        setLayout(true);
        event.currentTarget.blur();
      });
      document.getElementById("block").addEventListener("click", (event) => {
        setLayout(false);
        event.currentTarget.blur();
      });
    </script>
  </body>
</html>
