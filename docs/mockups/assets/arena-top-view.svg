<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 900" role="img" aria-labelledby="title desc">
  <title id="title">Taype-in — tactical arena</title>
  <desc id="desc">A top-down car soccer stadium with a striped grass pitch, rounded banked walls, recessed blue and orange goals, six large boost pads and two cars.</desc>
  <defs>
    <radialGradient id="backdrop"><stop stop-color="#172b40"/><stop offset="1" stop-color="#080f1c"/></radialGradient>
    <linearGradient id="turf" x2="0" y2="1"><stop stop-color="#295745"/><stop offset=".5" stop-color="#306651"/><stop offset="1" stop-color="#214b3e"/></linearGradient>
    <linearGradient id="bank" x2="0" y2="1"><stop stop-color="#64848a"/><stop offset=".15" stop-color="#354f57"/><stop offset=".8" stop-color="#253c43"/><stop offset="1" stop-color="#88a1a2"/></linearGradient>
    <radialGradient id="blueHalo"><stop stop-color="#208aff" stop-opacity=".3"/><stop offset="1" stop-color="#208aff" stop-opacity="0"/></radialGradient>
    <radialGradient id="orangeHalo"><stop stop-color="#ff8e27" stop-opacity=".26"/><stop offset="1" stop-color="#ff8e27" stop-opacity="0"/></radialGradient>
    <radialGradient id="ball"><stop offset="0" stop-color="#fff"/><stop offset=".65" stop-color="#d6dedb"/><stop offset="1" stop-color="#718b91"/></radialGradient>
    <pattern id="seats" width="19" height="17" patternUnits="userSpaceOnUse"><rect x="3" y="3" width="11" height="8" rx="2" fill="#657e97" opacity=".35"/><path d="M3 13h11" stroke="#030916" stroke-width="3"/></pattern>
    <pattern id="net" width="12" height="12" patternUnits="userSpaceOnUse"><path d="M12 0H0V12" fill="none" stroke="#b4d3de" stroke-opacity=".4"/></pattern>
    <pattern id="mowing" width="156" height="560" patternUnits="userSpaceOnUse"><rect width="78" height="560" fill="#a4d3aa" opacity=".045"/></pattern>
    <pattern id="grain" width="7" height="9" patternUnits="userSpaceOnUse"><path d="M1 2l1 2m3 2v2" stroke="#abd4a1" opacity=".065" stroke-width=".8"/></pattern>
    <pattern id="hatchBlue" width="16" height="16" patternUnits="userSpaceOnUse" patternTransform="rotate(-35)"><rect width="5" height="16" fill="#66bcff" opacity=".32"/></pattern>
    <pattern id="hatchOrange" width="16" height="16" patternUnits="userSpaceOnUse" patternTransform="rotate(35)"><rect width="5" height="16" fill="#ffa559" opacity=".32"/></pattern>
    <clipPath id="pitch"><rect x="213" y="204" width="974" height="492" rx="82"/></clipPath>
    <filter id="shadow" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="6"/></filter>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="4"/></filter>
    <g id="boost"><circle r="13" fill="#0c2026" stroke="#788482" stroke-width="2"/><circle r="8" fill="#ffb644" opacity=".2" filter="url(#glow)"/><circle r="6" fill="#ffd178"/><path d="M-2-4h4L0 1h3l-6 5 2-5h-3z" fill="#fff5d3"/></g>
    <g id="smallBoost"><circle r="6" fill="#14292b" stroke="#9c9c78"/><circle r="2.5" fill="#eabe71"/></g>
    <g id="car">
      <rect x="-27" y="-17" width="54" height="34" rx="13" fill="#000" opacity=".5" filter="url(#shadow)" transform="translate(3 5)"/>
      <g fill="#090e17" stroke="#526070" stroke-width="1.2"><rect x="-19" y="-19" width="14" height="8" rx="3"/><rect x="12" y="-19" width="13" height="8" rx="3"/><rect x="-19" y="11" width="14" height="8" rx="3"/><rect x="12" y="11" width="13" height="8" rx="3"/></g>
      <path d="M-25-11-15-15 20-13 28-8V8L20 13-15 15-25 11Z" fill="currentColor" stroke="#d6ebf3" stroke-opacity=".5" stroke-width="1"/>
      <path d="M-12-11 4-10 13-7V7L4 10-12 11-16 6V-6Z" fill="#102c40" stroke="#96cae0" stroke-opacity=".4"/>
      <path d="M-9-9H2L5 9H-9Z" fill="currentColor"/><path d="M-9-2H4V2H-9Z" fill="#dfe9ef"/>
      <path d="M15-11 24-7M15 11 24 7" stroke="#baf2ff" stroke-width="3"/>
      <rect x="-25" y="-18" width="5" height="36" rx="1.5" fill="currentColor" stroke="#e6eafa" stroke-opacity=".5"/>
      <path d="M-27-6h-5M-27 6h-5" stroke="#ffcb8b" stroke-width="4"/>
    </g>
  </defs>
  <rect width="1400" height="900" fill="url(#backdrop)"/>
