<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 170" role="img" aria-label="Taype-in">
  <!-- Concept b : mot-symbole en Russo One, traînée de boost qui sort de la queue du « y ». Police OFL incluse. -->
  <style>@font-face{font-family:"Russo One";src:url(data:font/woff2;base64,) format("woff2");}text{font-family:"Russo One",sans-serif;}</style>
  <defs>
    <linearGradient id="boost" x1="1" x2="0">
      <stop offset="0" stop-color="#f57c00"/>
      <stop offset="0.6" stop-color="#ff9a3c" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#ff9a3c" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <g id="trail">
    <path d="M0 134 L162 126 L162 142 Z" fill="url(#boost)"/>
    <path d="M40 152 L162 140 L162 150 Z" fill="url(#boost)" opacity="0.7"/>
    <path d="M60 120 L162 126 L162 130 Z" fill="url(#boost)" opacity="0.6"/>
  </g>
  <text x="40" y="112" font-size="96" fill="#1a5fd0" stroke="#0b1426" stroke-width="6" paint-order="stroke" stroke-linejoin="round">Ta<tspan fill="#f57c00">y</tspan>pe-in</text>
</svg>
